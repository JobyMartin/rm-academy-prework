
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Form</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>

  <div class="sidebar">
    <div class="photo-wrapper">
      <img src="images/sign-up-pic.jpg" alt="Leaves">
      <p class="photo-credit">Photo by Halie West on Unsplash</p>
    </div>
    <div class="logo-bar">
      <img src="images/odin-lined.png" alt="Odin Logo">
      <h1>ODIN</h1>
    </div>
  </div>

  <div class="main-layout">
    <div class="header">
      <h4>This is not a real online service. You know you need something like this in your life to help you realize your deepest dreams.</h4>
    </div>

    <div class="info">
      <h5>You <em>know</em> you want to...</h5>
    </div>
    
    <form class="forms">
      <div class="row">
        <div class="col">
          <input type="text" class="form-control" placeholder="First name" aria-label="First name" required>
        </div>
        <div class="col">
          <input type="text" class="form-control" placeholder="Last name" aria-label="Last name" required>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <input type="email" class="form-control" placeholder="Email" aria-label="Email" required>
        </div>
        <div class="col">
          <input type="text" class="form-control" placeholder="Phone number" aria-label="Phone number" required>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <input type="password" class="form-control" placeholder="Password" aria-label="Password" required minlength="8">
        </div>
        <div class="col">
          <input type="password" class="form-control" placeholder="Confirm password" aria-label="Confirm password" required minlength="8">
        </div>
      </div>

      <button type="submit" class="btn btn-success">Create Account</button>
      <p>Already have an account? <a href="#">Log in</a></p>
    </form>
  </div>
</body>
</html>
